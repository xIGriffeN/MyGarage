name: Build JIGGY

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean dist
        shell: powershell
        run: |
          if (Test-Path dist) {
            Remove-Item dist -Recurse -Force
          }

      - name: Install dependencies
        run: npm ci

      - name: Build JIGGY
        run: npm run dist
